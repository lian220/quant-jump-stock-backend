name: quant-jump-stock
services:
  # ========================================
  # Infrastructure (Always needed)
  # ========================================
  pubsub-emulator:
    image: thekevjames/gcloud-pubsub-emulator:latest
    container_name: qjs-pubsub-emulator
    ports:
      - "8681:8681"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8681 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      # 프로젝트ID,토픽:구독 형식 (thekevjames 이미지는 PUBSUB_PROJECT 사용)
      # ARM64 (Apple Silicon) 네이티브 지원
      PUBSUB_PROJECT1: "quantiq-local,economic-data-update-request:economic-data-update-request-sub,analysis-technical-request:analysis-technical-request-sub,analysis-sentiment-request:analysis-sentiment-request-sub,quantiq-backtest-request:quantiq-backtest-request-sub,vertex-ai-run-request:vertex-ai-run-request-sub,quantiq-economic-data-updated:quantiq-economic-data-updated-sub,quantiq-economic-data-sync-failed:quantiq-economic-data-sync-failed-sub,quantiq-analysis-completed:quantiq-analysis-completed-sub,quantiq-backtest-completed:quantiq-backtest-completed-sub,quantiq-backtest-failed:quantiq-backtest-failed-sub,quantiq-trading-signal-detected:quantiq-trading-signal-detected-sub,analysis-technical-failed:analysis-technical-failed-sub,analysis-sentiment-failed:analysis-sentiment-failed-sub,strategy-execution-completed:strategy-execution-completed-sub,strategy-execution-failed:strategy-execution-failed-sub,vertex-ai-run-submitted:vertex-ai-run-submitted-sub,vertex-ai-run-failed:vertex-ai-run-failed-sub,analysis-recommendation-request:analysis-recommendation-request-sub"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - quantiq-network

  pubsub-emulator-ui:
    image: ghcr.io/drehelis/gcp-emulator-ui:main
    container_name: qjs-pubsub-emulator-ui
    ports:
      - "8680:80"
    depends_on:
      - pubsub-emulator
    environment:
      PUBSUB_EMULATOR_URL: "pubsub-emulator:8681"
      # 미사용 에뮬레이터 - nginx upstream 해소용 더미 값
      STORAGE_EMULATOR_URL: "pubsub-emulator:8681"
      FIRESTORE_EMULATOR_URL: "pubsub-emulator:8681"
      DATASTORE_EMULATOR_URL: "pubsub-emulator:8681"
      DATASTORE_FILE_SERVER_URL: "pubsub-emulator:8681"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - quantiq-network

  # ========================================
  # Local Database Services (profile: local)
  # ========================================
  postgresql:
    image: postgres:15-alpine
    container_name: qjs-postgres
    profiles: [ "local" ]
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${DB_NAME:-quantiq}
      POSTGRES_USER: ${DB_USER:-quantiq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      PGDATA: /var/lib/postgresql/data/pgdata
      # pg_isready가 사용하는 환경변수
      PGUSER: ${DB_USER:-quantiq_user}
      PGDATABASE: ${DB_NAME:-quantiq}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    shm_size: 256M
    networks:
      - quantiq-network

  mongodb:
    image: mongo:latest
    container_name: qjs-mongodb
    profiles: [ "local" ]
    ports:
      - "27017:27017"
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    environment:
      MONGO_INITDB_ROOT_USERNAME: quantiq_user
      MONGO_INITDB_ROOT_PASSWORD: quantiq_password
      MONGO_INITDB_DATABASE: stock_trading
    command: mongod --auth --wiredTigerCacheSizeGB 0.5
    volumes:
      - ./data/mongodb:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  # ========================================
  # Application Services
  # ========================================
  quant-jump-stock-data-engine:
    build:
      context: ./quant-jump-stock-data-engine
      dockerfile: Dockerfile
    container_name: qjs-data-engine
    ports:
      - "${DATA_ENGINE_PORT:-10020}:${DATA_ENGINE_PORT:-10020}"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: "Asia/Seoul"
      # MongoDB - env var 우선, 미설정시 로컬 Docker
      MONGODB_URI: ${MONGODB_URI:-mongodb://quantiq_user:quantiq_password@mongodb:27017/stock_trading?authSource=admin}
      # PostgreSQL - env var 우선, 미설정시 로컬 Docker
      DB_HOST: ${DB_HOST:-postgresql}
      DB_PORT: ${DB_PORT:-5432}
      # Server Port (Data Engine)
      SERVER_PORT: ${DATA_ENGINE_PORT:-10020}
      # Pub/Sub (컨테이너 네트워크용 기본값 설정)
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-pubsub-emulator:8681}
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-quantiq-local}
      # APIs
      FRED_API_KEY: ${FRED_API_KEY}
      # Slack (SLACK_BOT_TOKEN은 .env.common에서 로드)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL_SCHEDULER}
      SLACK_CHANNEL: "C0A1XASTLH2"
      # Google Cloud (container path override)
      VERTEX_AI_CREDENTIALS_PATH: "/app/credentials/vertex-ai-key.json"
      # ML Scripts path
      ML_SCRIPTS_DIR: "/scripts/ml"
    volumes:
      - ./quant-jump-stock-data-engine:/app
      - ./credentials:/app/credentials
      - ./scripts:/scripts
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  quant-jump-stock-core:
    build:
      context: ./quant-jump-stock-core
      dockerfile: Dockerfile
    container_name: qjs-core
    ports:
      - "${CORE_API_PORT:-10010}:${CORE_API_PORT:-10010}"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    volumes:
      - ./credentials:/app/credentials
      - ./quant-jump-stock-data-engine:/quant-jump-stock-data-engine
      - ./.env.prod:/app/.env.prod:ro
      - ./scripts:/scripts
    environment:
      TZ: "Asia/Seoul"
      # Server Port (Core API)
      SERVER_PORT: ${CORE_API_PORT:-10010}
      # PostgreSQL - env var 우선, 미설정시 로컬 Docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${DB_HOST:-postgresql}:${DB_PORT:-5432}/${DB_NAME:-quantiq}}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-quantiq_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      DB_HOST: ${DB_HOST:-postgresql}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-quantiq}
      DB_USER: ${DB_USER:-quantiq_user}
      DB_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      # MongoDB - env var 우선, 미설정시 로컬 Docker
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://quantiq_user:quantiq_password@mongodb:27017/stock_trading?authSource=admin}
      # Messaging: 로컬은 Pub/Sub 사용
      MESSAGING_PROVIDER: "pubsub"
      # Pub/Sub (컨테이너 네트워크용 기본값 설정)
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-pubsub-emulator:8681}
      SPRING_CLOUD_GCP_PUBSUB_EMULATORHOST: ${PUBSUB_EMULATOR_HOST:-pubsub-emulator:8681}
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-quantiq-local}
      # KafkaAutoConfiguration 제외 (로컬에서 Kafka 브로커 없음)
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration"
      # Slack (SLACK_BOT_TOKEN은 .env.common에서 로드)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL_TRADING}
      SLACK_CHANNEL: "C0A1XASTLH2"
      # KIS (Korean Investment & Securities) - Temporary
      KIS_APP_KEY: "test_app_key"
      KIS_APP_SECRET: "test_app_secret"
      # Migration
      DB_DUAL_WRITE: "true"
      DB_READ_SOURCE: "rdb"
      RUN_MIGRATION: "true"
      # Google Cloud (GCP_ENABLED는 env_file에서 로드)
      # 컨테이너 내부 크레덴셜 경로만 고정 설정
      VERTEX_AI_CREDENTIALS_PATH: "/app/credentials/vertex-ai-key.json"
      # JVM Heap Settings
      JAVA_OPTS: "-Xmx768m -Xms512m -XX:MaxMetaspaceSize=256m"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          memory: 768M
    networks:
      - quantiq-network

networks:
  quantiq-network:
    external: true
    name: quant-jump-stock_quantiq-network
