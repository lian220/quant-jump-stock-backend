name: quant-jump-stock
services:
  # ========================================
  # Infrastructure (Always needed)
  # ========================================
  pubsub-emulator:
    image: thekevjames/gcloud-pubsub-emulator:latest
    container_name: qjs-pubsub-emulator
    ports:
      - "8681:8681"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8681 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      # 프로젝트ID,토픽:구독 형식 (thekevjames 이미지는 PUBSUB_PROJECT 사용)
      # ARM64 (Apple Silicon) 네이티브 지원
      PUBSUB_PROJECT1: "quantiq-local,economic-data-update-request:economic-data-update-request-sub,analysis-technical-request:analysis-technical-request-sub,analysis-sentiment-request:analysis-sentiment-request-sub,quantiq-backtest-request:quantiq-backtest-request-sub,vertex-ai-run-request:vertex-ai-run-request-sub,quantiq-economic-data-updated:quantiq-economic-data-updated-sub,quantiq-economic-data-sync-failed:quantiq-economic-data-sync-failed-sub,quantiq-analysis-completed:quantiq-analysis-completed-sub,quantiq-backtest-completed:quantiq-backtest-completed-sub,quantiq-backtest-failed:quantiq-backtest-failed-sub,quantiq-trading-signal-detected:quantiq-trading-signal-detected-sub,analysis-technical-failed:analysis-technical-failed-sub,analysis-sentiment-failed:analysis-sentiment-failed-sub,strategy-execution-completed:strategy-execution-completed-sub,strategy-execution-failed:strategy-execution-failed-sub,vertex-ai-run-submitted:vertex-ai-run-submitted-sub,vertex-ai-run-failed:vertex-ai-run-failed-sub,analysis-recommendation-request:analysis-recommendation-request-sub,quantiq-news-collection-request:quantiq-news-collection-request-sub,quantiq-news-collected:quantiq-news-collected-sub,quantiq-news-collection-failed:quantiq-news-collection-failed-sub"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - quantiq-network

  pubsub-emulator-ui:
    image: ghcr.io/drehelis/gcp-emulator-ui:main
    container_name: qjs-pubsub-emulator-ui
    ports:
      - "8680:80"
    depends_on:
      - pubsub-emulator
    environment:
      PUBSUB_EMULATOR_URL: "pubsub-emulator:8681"
      # 미사용 에뮬레이터 - nginx upstream 해소용 더미 값
      STORAGE_EMULATOR_URL: "pubsub-emulator:8681"
      FIRESTORE_EMULATOR_URL: "pubsub-emulator:8681"
      DATASTORE_EMULATOR_URL: "pubsub-emulator:8681"
      DATASTORE_FILE_SERVER_URL: "pubsub-emulator:8681"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - quantiq-network

  # ========================================
  # Local Database Services (profile: local)
  # ========================================
  postgresql:
    image: postgres:15-alpine
    container_name: qjs-postgres
    profiles: [ "local" ]
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${DB_NAME:-quantiq}
      POSTGRES_USER: ${DB_USER:-quantiq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      PGDATA: /var/lib/postgresql/data/pgdata
      # pg_isready가 사용하는 환경변수
      PGUSER: ${DB_USER:-quantiq_user}
      PGDATABASE: ${DB_NAME:-quantiq}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    shm_size: 256M
    networks:
      - quantiq-network

  mongodb:
    image: mongo:latest
    container_name: qjs-mongodb
    profiles: [ "local" ]
    ports:
      - "27017:27017"
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    environment:
      MONGO_INITDB_ROOT_USERNAME: quantiq_user
      MONGO_INITDB_ROOT_PASSWORD: quantiq_password
      MONGO_INITDB_DATABASE: stock_trading
    command: mongod --auth --wiredTigerCacheSizeGB 0.5
    volumes:
      - ./data/mongodb:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  # ========================================
  # Application Services
  # ========================================
  quant-jump-stock-data-engine:
    build:
      context: ./quant-jump-stock-data-engine
      dockerfile: Dockerfile
    container_name: qjs-data-engine
    ports:
      - "${DATA_ENGINE_PORT:-10020}:${DATA_ENGINE_PORT:-10020}"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: "Asia/Seoul"
      # MongoDB/PostgreSQL - env_file(DB_ENV_FILE)에서 환경별로 로드됨
      # 여기서 재정의하면 env_file 값을 덮어써서 prod 연결이 안 되는 문제 발생
      # 로컬: .env.db.local (mongodb:27017, postgresql:5432)
      # 프로덕션: .env.db.prod (Atlas URI, Supabase)
      # Server Port (Data Engine)
      SERVER_PORT: ${DATA_ENGINE_PORT:-10020}
      # Pub/Sub - 로컬 에뮬레이터 고정 (GCP 배포는 Cloud Run에서 별도 설정)
      # .env.prod의 PUBSUB_PROJECT_ID(GCP 프로젝트 ID)가 호스트 shell에 export되어도
      # docker-compose는 항상 로컬 에뮬레이터를 사용해야 하므로 고정값으로 설정
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8681
      PUBSUB_PROJECT_ID: quantiq-local
      # Slack
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-C0A1XASTLH2}
      # Google Cloud
      VERTEX_AI_ENABLED: ${VERTEX_AI_ENABLED:-false}
      VERTEX_AI_CREDENTIALS_PATH: "/app/credentials/vertex-ai-key.json"
      # ML Scripts path
      ML_SCRIPTS_DIR: "/scripts/ml"
      # PostgreSQL Pool Size (Supabase Session 모드 연결 수 제한 대응)
      PG_POOL_MAX_CONN: 2
      PG_POOL_MIN_CONN: 1
    volumes:
      - ./quant-jump-stock-data-engine:/app
      - ./credentials:/app/credentials
      - ./scripts:/scripts
      - ./.env.db.prod:/config/.env.db.prod:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  quant-jump-stock-core:
    build:
      context: ./quant-jump-stock-core
      dockerfile: Dockerfile
    container_name: qjs-core
    ports:
      - "${CORE_API_PORT:-10010}:${CORE_API_PORT:-10010}"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    env_file:
      - .env.common
      - ${DB_ENV_FILE:-.env.db.local}
      - ${ENV_FILE:-.env.local}
    volumes:
      - ./credentials:/app/credentials
      - ./quant-jump-stock-data-engine:/quant-jump-stock-data-engine
      - ./scripts:/scripts
    environment:
      TZ: "Asia/Seoul"
      # Server Port (Core API)
      SERVER_PORT: ${CORE_API_PORT:-10010}
      # PostgreSQL/MongoDB - env_file(DB_ENV_FILE)에서 환경별로 로드됨
      # 여기서 재정의하면 env_file 값을 덮어써서 prod 연결이 안 되는 문제 발생
      # 로컬: .env.db.local (postgresql:5432, mongodb:27017)
      # 프로덕션: .env.db.prod (Supabase URI, MongoDB Atlas URI)
      # Messaging: 로컬은 Pub/Sub 사용
      MESSAGING_PROVIDER: "pubsub"
      # Pub/Sub - 로컬 에뮬레이터 고정 (GCP 배포는 Cloud Run에서 별도 설정)
      # .env.prod의 PUBSUB_PROJECT_ID(GCP 프로젝트 ID)가 호스트 shell에 export되어도
      # docker-compose는 항상 로컬 에뮬레이터를 사용해야 하므로 고정값으로 설정
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8681
      SPRING_CLOUD_GCP_PUBSUB_EMULATORHOST: pubsub-emulator:8681
      PUBSUB_PROJECT_ID: quantiq-local
      # Slack - 기본값 비활성화, .env.prod에서 활성화
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL_SCHEDULER:-}
      SLACK_WEBHOOK_URL_ERROR: ${SLACK_WEBHOOK_URL_ERROR:-}
      # Vertex AI - .env.common의 GCP_CREDENTIALS_ENCODED로 인증
      VERTEX_AI_ENABLED: ${VERTEX_AI_ENABLED:-false}
      # KIS (Korean Investment & Securities) - Temporary
      KIS_APP_KEY: "test_app_key"
      KIS_APP_SECRET: "test_app_secret"
      # Migration
      DB_DUAL_WRITE: "true"
      DB_READ_SOURCE: "rdb"
      # Data Engine (컨테이너 네트워크용)
      DATA_ENGINE_BASE_URL: "http://quant-jump-stock-data-engine:${DATA_ENGINE_PORT:-10020}"
      # HikariCP Pool Size (Supabase Session 모드 연결 수 제한 대응)
      HIKARI_MAX_POOL_SIZE: 2
      HIKARI_MIN_IDLE: 1
      # JVM Heap Settings
      JAVA_OPTS: "-Xmx768m -Xms512m -XX:MaxMetaspaceSize=256m"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          memory: 768M
    networks:
      - quantiq-network

networks:
  quantiq-network:
    external: true
    name: quant-jump-stock_quantiq-network
