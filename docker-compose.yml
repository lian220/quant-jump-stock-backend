name: quant-jump-stock
services:
  # ========================================
  # Infrastructure (Always needed)
  # ========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: qjs-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - quantiq-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: qjs-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: qjs-kafka-ui
    ports:
      - "8089:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: qjs-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - quantiq-network

  # ========================================
  # Local Database Services (profile: local)
  # ========================================
  postgresql:
    image: postgres:15-alpine
    container_name: qjs-postgres
    profiles: [ "local" ]
    env_file:
      - .env.common
      - ${ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${DB_NAME:-quantiq}
      POSTGRES_USER: ${DB_USER:-quantiq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quantiq_user" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    shm_size: 256M
    networks:
      - quantiq-network

  mongodb:
    image: mongo:latest
    container_name: qjs-mongodb
    profiles: [ "local" ]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: quantiq_user
      MONGO_INITDB_ROOT_PASSWORD: quantiq_password
      MONGO_INITDB_DATABASE: stock_trading
    command: mongod --auth --wiredTigerCacheSizeGB 0.5
    volumes:
      - ./data/mongodb:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  # ========================================
  # Application Services
  # ========================================
  quant-jump-stock-data-engine:
    build:
      context: ./quant-jump-stock-data-engine
      dockerfile: Dockerfile
    container_name: qjs-data-engine
    ports:
      - "10020:8000"
    depends_on:
      kafka:
        condition: service_started
    env_file:
      - .env.common
      - ${ENV_FILE:-.env.local}
    environment:
      TZ: "Asia/Seoul"
      # MongoDB - Docker 내부에서는 서비스 이름 사용
      MONGODB_URI: ${MONGODB_URI:-mongodb://quantiq_user:quantiq_password@mongodb:27017/stock_trading?authSource=admin}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      # APIs
      FRED_API_KEY: ${FRED_API_KEY}
      # Slack
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL_SCHEDULER}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_CHANNEL: "C0A1XASTLH2"
      # Google Cloud (container path override)
      GOOGLE_APPLICATION_CREDENTIALS: "/app/credentials/vertex-ai-key.json"
      # ML Scripts path
      ML_SCRIPTS_DIR: "/scripts/ml"
    volumes:
      - ./quant-jump-stock-data-engine:/app
      - ./credentials:/app/credentials
      - ./scripts:/scripts
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - quantiq-network

  quant-jump-stock-core:
    build:
      context: ./quant-jump-stock-core
      dockerfile: Dockerfile
    container_name: qjs-core
    ports:
      - "10010:10010"
    depends_on:
      kafka:
        condition: service_started
    env_file:
      - .env.common
      - ${ENV_FILE:-.env.local}
    volumes:
      - ./credentials:/app/credentials
      - ./quant-jump-stock-data-engine:/quant-jump-stock-data-engine
      - ./.env.prod:/app/.env.prod:ro
      - ./scripts:/scripts
    environment:
      TZ: "Asia/Seoul"
      # PostgreSQL - Use env vars from env_file
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgresql}:${DB_PORT:-5432}/${DB_NAME:-quantiq}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-quantiq_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      # PostgreSQL - for application.yml (Quartz uses these)
      DB_HOST: ${DB_HOST:-postgresql}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-quantiq}
      DB_USER: ${DB_USER:-quantiq_user}
      DB_PASSWORD: ${DB_PASSWORD:-quantiq_password}
      # MongoDB - use env vars (supports both local and prod)
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://quantiq_user:quantiq_password@mongodb:27017/stock_trading?authSource=admin}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      # Slack
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL_TRADING}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_CHANNEL: "C0A1XASTLH2"
      # KIS (Korean Investment & Securities) - Temporary
      KIS_APP_KEY: "test_app_key"
      KIS_APP_SECRET: "test_app_secret"
      # Migration
      DB_DUAL_WRITE: "true"
      DB_READ_SOURCE: "rdb"
      RUN_MIGRATION: "true"
      # Google Cloud (container path override)
      GOOGLE_APPLICATION_CREDENTIALS: "/app/credentials/vertex-ai-key.json"
      # JVM Heap Settings
      JAVA_OPTS: "-Xmx768m -Xms512m -XX:MaxMetaspaceSize=256m"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          memory: 768M
    networks:
      - quantiq-network

networks:
  quantiq-network:
    external: true
    name: quant-jump-stock_quantiq-network
