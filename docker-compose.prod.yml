# ============================================================
# Quant Jump Stock - Production (GCE VM)
# ============================================================
# Core API (HTTP + Quartz + Pub/Sub) + Nginx를 VM에서 실행.
# Data Engine / Frontend / Backoffice는 Cloud Run.
#
# 환경변수: Secret Manager → .env 파일 3개 다운로드
#   qjs-env-common  → .env.common
#   qjs-env-db-prod → .env.db.prod
#   qjs-env-prod    → .env.prod
# ============================================================

services:
  # ── Nginx (Reverse Proxy) ──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: qjs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      core:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 32M
    restart: unless-stopped

  # ── Core API (HTTP + Quartz + Pub/Sub) ─────────────────
  core:
    image: ${AR_REPO}/qjs-core:latest
    container_name: qjs-core
    env_file:
      # Secret Manager에서 다운로드한 env 파일 3개
      # Spring Boot application.yml이 ${DB_HOST}, ${MONGODB_URI} 등을 직접 읽음
      - path: ./quant-jump-stock-backend/.env.common
        required: false
      - path: ./quant-jump-stock-backend/.env.db.prod
        required: false
      - path: ./quant-jump-stock-backend/.env.prod
        required: false
    environment:
      # docker-compose 전용 설정 (env 파일에 없는 것들만)
      - DOCKER_CONTAINER=true
      - SERVER_PORT=10010
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_QUARTZ_JOB_STORE_TYPE=memory
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      # Pub/Sub: PUBSUB_CREDENTIALS_ENCODED 미설정 → ADC 사용 (VM SA: lian-web)
      # GCP_CREDENTIALS_ENCODED(vertex-ai-service SA)와 분리하여 인증 실패 격리
    healthcheck:
      # liveness만 체크 — 외부 의존성(Pub/Sub) 실패가 컨테이너 재시작을 유발하지 않도록
      test: ["CMD-SHELL", "curl -sf http://localhost:10010/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    expose:
      - "10010"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # NOTE: Data Engine은 Cloud Run qjs-data-engine으로 분리됨
  # NOTE: Kafka/Zookeeper는 Pub/Sub으로 대체됨
