# ============================================================
# Quant Jump Stock - Production (GCE VM)
# ============================================================
# Backend 서비스만. Frontend/Backoffice는 Cloud Run.
# Artifact Registry에서 이미지 pull.
# ============================================================

services:
  # ── Nginx (API 리버스 프록시) ─────────────────────────────
  # NOTE: build 대신 image + volume mount 사용
  # → 배포 시 이미지 재빌드 없이 항상 최신 설정 적용
  # → nginx.conf 변경 시: docker compose -f docker-compose.prod.yml restart nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: qjs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      core:
        condition: service_started
      data-engine:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 32M
    restart: unless-stopped

  # ── Core API (Spring Boot) ────────────────────────────────
  core:
    image: ${AR_REPO}/qjs-core:latest
    container_name: qjs-core
    env_file:
      - path: ./quant-jump-stock-backend/.env.common
        required: false
      - path: ./quant-jump-stock-backend/.env.prod
        required: false
    environment:
      - DOCKER_CONTAINER=true
      - SERVER_PORT=10010
      - JAVA_OPTS=-Xmx768m -Xms384m
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-quantiq}?prepareThreshold=0
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - SPRING_QUARTZ_JOB_STORE_TYPE=memory
      - MESSAGING_PROVIDER=pubsub
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID:-${GCP_PROJECT_ID}}
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      # OAuth2 + JWT
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - JWT_ISSUER=${JWT_ISSUER:-quant-jump-stock}
      - OAUTH_FRONTEND_REDIRECT_URL=${OAUTH_FRONTEND_REDIRECT_URL:-https://alphafoundry.app/auth/callback}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://alphafoundry.app}
      # GCP credentials (GCP SDK 인증 + Vertex AI)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/vertex-ai-key.json
      - VERTEX_AI_CREDENTIALS_PATH=/app/credentials/vertex-ai-key.json
    volumes:
      - ./credentials:/app/credentials:ro
    expose:
      - "10010"
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  # ── Data Engine (FastAPI) ─────────────────────────────────
  data-engine:
    image: ${AR_REPO}/qjs-data-engine:latest
    container_name: qjs-data-engine
    env_file:
      - path: ./quant-jump-stock-backend/.env.common
        required: false
      - path: ./quant-jump-stock-backend/.env.prod
        required: false
    environment:
      - ENVIRONMENT=prod
      - SERVER_PORT=10020
      - MONGODB_URI=${MONGODB_URI}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID:-${GCP_PROJECT_ID}}
      # GCP credentials (GCP SDK 인증 + Vertex AI)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/vertex-ai-key.json
      - VERTEX_AI_CREDENTIALS_PATH=/app/credentials/vertex-ai-key.json
    volumes:
      - ./credentials:/app/credentials:ro
    expose:
      - "10020"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

