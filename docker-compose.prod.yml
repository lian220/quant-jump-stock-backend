# ============================================================
# Quant Jump Stock - Production (GCE VM)
# ============================================================
# Backend 서비스만. Frontend/Backoffice는 Cloud Run.
# Artifact Registry에서 이미지 pull.
# ============================================================

services:
  # ── Nginx (API 리버스 프록시) ─────────────────────────────
  # NOTE: build 대신 image + volume mount 사용
  # → 배포 시 이미지 재빌드 없이 항상 최신 설정 적용
  # → nginx.conf 변경 시: docker compose -f docker-compose.prod.yml restart nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: qjs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      core:
        condition: service_started
      data-engine:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 32M
    restart: unless-stopped

  # ── Core API (Spring Boot) ────────────────────────────────
  core:
    image: ${AR_REPO}/qjs-core:latest
    container_name: qjs-core
    env_file:
      - path: ./quant-jump-stock-backend/.env.common
        required: false
      - path: ./quant-jump-stock-backend/.env.prod
        required: false
    environment:
      - DOCKER_CONTAINER=true
      - SERVER_PORT=10010
      - JAVA_OPTS=-Xmx768m -Xms384m
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-quantiq}?prepareThreshold=0
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - SPRING_QUARTZ_JOB_STORE_TYPE=memory
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      # OAuth2 + JWT
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - JWT_ISSUER=${JWT_ISSUER:-quant-jump-stock}
      - OAUTH_FRONTEND_REDIRECT_URL=${OAUTH_FRONTEND_REDIRECT_URL:-https://alphafoundry.app/auth/callback}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://alphafoundry.app}
      # Vertex AI credentials
      - VERTEX_AI_CREDENTIALS_PATH=/app/credentials/vertex-ai-key.json
    volumes:
      - ./credentials:/app/credentials:ro
    expose:
      - "10010"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  # ── Data Engine (FastAPI) ─────────────────────────────────
  data-engine:
    image: ${AR_REPO}/qjs-data-engine:latest
    container_name: qjs-data-engine
    env_file:
      - path: ./quant-jump-stock-backend/.env.common
        required: false
      - path: ./quant-jump-stock-backend/.env.prod
        required: false
    environment:
      - ENVIRONMENT=prod
      - SERVER_PORT=10020
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGODB_URI=${MONGODB_URI}
      # Vertex AI credentials
      - VERTEX_AI_CREDENTIALS_PATH=/app/credentials/vertex-ai-key.json
    volumes:
      - ./credentials:/app/credentials:ro
    expose:
      - "10020"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ── Kafka (초경량 설정) ─────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: qjs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          memory: 96M
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: qjs-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_PROTOCOL: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms192M"
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped
