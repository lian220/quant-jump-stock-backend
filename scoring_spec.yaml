# 점수 모델 SSoT — PR 1 (현행 행동 보존형 중앙화)
# 본 파일은 backend repo 루트. Data Engine 이미지 빌드 시 COPY 됨.
# Python ScoringPolicy 가 SCORING_SPEC_PATH env 또는 default 경로로 로드.
# 본 PR 에서는 현행 가중치/임계/cap 값과 100% 일치 (regression 0 변화 목표).
# 행동 변경 (disagreement/veto/redistribute/VIX) 은 PR 3/4/5 에서 적용.

spec_version: "1.2.0"
formula_version: "1.2.0"  # PR 5 (2026-05-22): VIX 거시 gate 추가
# 변경 이력:
#   1.0.0 — PR 1 SSoT 중앙화 (현행 보존, 2026-05-21)
#   1.1.0 — PR 3b negative AI veto: rise_pct<0 → composite=0 + grade=D + label=NONE (2026-05-22)
#   1.2.0 — PR 5 VIX macro gate: 시장 변동성 임계 초과 시 추천 전체 차단 (2026-05-22)
description: |
  AI 예측 + 뉴스 감정 + 기술 분석 가중 합산. 현행 산식 100% 일치 보존.
  본 spec 변경 시 quant-jump-stock-data-engine 테스트 (golden + property +
  regression) 재실행 필수.

consumers:
  - python_data_engine
# PR 2 이후 kotlin_core_api 추가 — contract 변경 PR 강제

axes:
  ai:
    weight: 0.3
    max: 10.0
    cap_strategy: fixed_pct
    cap_threshold_pct: 20.0       # 현행 유지 (vol_normalized 는 PR 후속)
    missing_policy: zero           # 현행 유지
    negative_policy: veto          # PR 3b (2026-05-22): rise_pct<0 → composite=0 + grade=D + label=NONE. rollback: zero
  technical:
    weight: 0.4
    max: 3.5
    components:
      golden_cross: 1.5
      rsi_below_threshold: 1.0
      macd_buy_signal: 1.0
    rsi_threshold: 70
    missing_policy: zero
  sentiment:
    weight: 0.3
    max: 10.0
    missing_policy: zero           # 현행 유지 (PR 4 에서 redistribute 검토)

composite_max: 7.4                 # derived: 0.3*10 + 0.4*3.5 + 0.3*10. load 시 검증

grades:
  S: { min: 6.0, label: "매우 강한 매수", color: emerald }
  A: { min: 4.5, label: "강한 매수",     color: cyan }
  B: { min: 3.0, label: "보통 매수",     color: yellow }
  C: { min: 1.5, label: "약한 매수",     color: orange }
  D: { min: 0.0, label: "신호 없음",     color: red }

# Slack 표시 라벨 — 본 PR 은 현행 RecommendationGrade.from_scores() 매핑 100% 보존
# 즉, confidence + tech_signals 기반 임계. PR 2 에서 grade 기반으로 변경 예정.
recommendation_labels:
  STRONG:    { min_confidence: 0.65, min_tech_signals: 3, label: "강력 추천", emoji: "🟢" }
  RECOMMEND: { min_confidence: 0.45, min_tech_signals: 2, label: "추천",       emoji: "🟡" }
  WATCH:     { min_confidence: 0.30, min_tech_signals: 1, label: "관심 종목",  emoji: "🟠" }
  NONE:      { label: "추천 없음", emoji: "⚪" }

recommendation_filter:
  min_composite_score: 2.0          # 현행 유지 (PR 3d 에서 3.0 검토)
  max_recommendations: 5

# PR 5 (2026-05-22): 거시 시장 변동성 gate.
# 산식 외부 pre-flight gate — 산식 자체는 안 건드림. 추천 산출 후 송출 직전 검사.
# 발동 시 사용자 채널 송출 차단 + 운영자 채널 알림. VIX 값 결손 시 gate skip (안전 default).
# rollback: enabled: false 또는 threshold: 999 로 raise.
macro_gates:
  vix:
    enabled: true
    threshold: 35.0               # VIX > 35 시 차단. prod 최근 30일 평균 17.93 (저변동성), 여유.
    source: "daily_stock_data.yfinance_indicators.^VIX"
    missing_policy: skip          # skip = gate 미발동 (정상 진행) | block = 차단
    description: "시장 변동성 과다 시 추천 전체 차단 (Taleb 비대칭 위험 — 변동성 폭증 시 신호 노이즈)"
