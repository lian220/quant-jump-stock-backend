[tool.poetry]
name = "quantiq-data-engine"
version = "0.1.0"
description = "Data processing engine for Quantiq"
authors = ["Quantiq Team"]
readme = "README.md"
packages = [
    {include = "core", from = "src"},
    {include = "events", from = "src"},
    {include = "features", from = "src"},
    {include = "services", from = "src"},
    {include = "config", from = "src"},
    {include = "domain", from = "src"},
    {include = "application", from = "src"},
    {include = "adapter", from = "src"}
]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.0"
numpy = "^1.26.0"
requests = "^2.31.0"
yfinance = "^0.2.36"
pymongo = "^4.6.1"
google-cloud-pubsub = "^2.18.0"
python-dotenv = "^1.0.1"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
google-cloud-storage = "^2.10.0"
psycopg2-binary = "^2.9.9"
pytz = "^2024.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
google-cloud-aiplatform = "^1.38.0"
deep-translator = "^1.11.0"
pyyaml = ">=6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.0"
hypothesis = ">=6"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
