name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'quant-jump-stock-core/**'
      - 'quant-jump-stock-data-engine/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'quant-jump-stock-core/**'
      - 'quant-jump-stock-data-engine/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  # ============================================
  # Kotlin/Spring Boot Core API 테스트
  # ============================================
  test-kotlin-core:
    name: Test Kotlin Core API
    runs-on: ubuntu-latest

    services:
      # PostgreSQL 서비스
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: quantiq
          POSTGRES_USER: quantiq_user
          POSTGRES_PASSWORD: quantiq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # MongoDB 서비스
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: quantiq_user
          MONGO_INITDB_ROOT_PASSWORD: quantiq_password
          MONGO_INITDB_DATABASE: stock_trading
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Kafka (테스트에 필요한 경우)
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Grant execute permission for gradlew
        working-directory: ./quant-jump-stock-core
        run: chmod +x gradlew

      - name: 📦 Build with Gradle
        working-directory: ./quant-jump-stock-core
        run: ./gradlew build -x test

      - name: 🧪 Run tests
        working-directory: ./quant-jump-stock-core
        run: ./gradlew test
        env:
          # Database
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: quantiq
          DB_USER: quantiq_user
          DB_PASSWORD: quantiq_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/quantiq
          SPRING_DATASOURCE_USERNAME: quantiq_user
          SPRING_DATASOURCE_PASSWORD: quantiq_password
          # MongoDB
          MONGODB_URI: mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin
          SPRING_DATA_MONGODB_URI: mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin
          # Kafka
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          # Security
          APP_ENCRYPTION_KEY: CHANGE_THIS_TO_32_CHARACTERS_KEY
          # Test keys (not real)
          FRED_API_KEY: test_fred_key_for_ci
          KIS_APP_KEY: test_kis_key
          KIS_APP_SECRET: test_kis_secret

      - name: 📊 Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Kotlin Core Test Results
          path: quant-jump-stock-core/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: 📈 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-test-results
          path: quant-jump-stock-core/build/reports/tests/test/

  # ============================================
  # Python/FastAPI Data Engine 테스트
  # ============================================
  test-python-data-engine:
    name: Test Python Data Engine
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: quantiq_user
          MONGO_INITDB_ROOT_PASSWORD: quantiq_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔧 Install dependencies
        working-directory: ./quant-jump-stock-data-engine
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: ✅ Check Python syntax
        working-directory: ./quant-jump-stock-data-engine
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*")

      - name: 🧪 Run pytest (if exists)
        working-directory: ./quant-jump-stock-data-engine
        if: hashFiles('quant-jump-stock-data-engine/tests/**') != ''
        run: poetry run pytest
        env:
          MONGODB_URI: mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin
          DB_HOST: localhost
          DB_PORT: 5432

      - name: 📊 Upload Python test results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('quant-jump-stock-data-engine/tests/**') != ''
        with:
          name: python-test-results
          path: quant-jump-stock-data-engine/.pytest_cache/

  # ============================================
  # 통합 상태 체크
  # ============================================
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [test-kotlin-core, test-python-data-engine]
    if: always()

    steps:
      - name: ✅ All tests passed
        if: ${{ needs.test-kotlin-core.result == 'success' && needs.test-python-data-engine.result == 'success' }}
        run: echo "✅ All backend tests passed!"

      - name: ❌ Some tests failed
        if: ${{ needs.test-kotlin-core.result != 'success' || needs.test-python-data-engine.result != 'success' }}
        run: |
          echo "❌ Backend tests failed!"
          echo "Kotlin Core: ${{ needs.test-kotlin-core.result }}"
          echo "Python Data Engine: ${{ needs.test-python-data-engine.result }}"
          exit 1
