name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'quant-jump-stock-core/**'
      - 'quant-jump-stock-data-engine/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'quant-jump-stock-core/**'
      - 'quant-jump-stock-data-engine/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  # ============================================
  # 변경된 파일 감지
  # ============================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      data-engine: ${{ steps.filter.outputs.data-engine }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'quant-jump-stock-core/**'
              - '.github/workflows/backend-ci.yml'
            data-engine:
              - 'quant-jump-stock-data-engine/**'
              - '.github/workflows/backend-ci.yml'

  # ============================================
  # Kotlin/Spring Boot Core API 테스트
  # ============================================
  test-kotlin-core:
    name: Test Kotlin Core API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'

    services:
      # PostgreSQL 서비스
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: quantiq
          POSTGRES_USER: quantiq_user
          POSTGRES_PASSWORD: quantiq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # MongoDB 서비스
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: quantiq_user
          MONGO_INITDB_ROOT_PASSWORD: quantiq_password
          MONGO_INITDB_DATABASE: stock_trading
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Pub/Sub Emulator
      pubsub-emulator:
        image: thekevjames/gcloud-pubsub-emulator:latest
        env:
          PUBSUB_PROJECT1: "quantiq-local,economic-data-update-request:economic-data-update-request-sub,analysis-technical-request:analysis-technical-request-sub,analysis-sentiment-request:analysis-sentiment-request-sub,quantiq-backtest-request:quantiq-backtest-request-sub,vertex-ai-run-request:vertex-ai-run-request-sub,quantiq-economic-data-updated:quantiq-economic-data-updated-sub,quantiq-economic-data-sync-failed:quantiq-economic-data-sync-failed-sub,quantiq-analysis-completed:quantiq-analysis-completed-sub,quantiq-backtest-completed:quantiq-backtest-completed-sub,quantiq-backtest-failed:quantiq-backtest-failed-sub,quantiq-trading-signal-detected:quantiq-trading-signal-detected-sub,analysis-technical-failed:analysis-technical-failed-sub,analysis-sentiment-failed:analysis-sentiment-failed-sub,strategy-execution-completed:strategy-execution-completed-sub,strategy-execution-failed:strategy-execution-failed-sub,vertex-ai-run-submitted:vertex-ai-run-submitted-sub,vertex-ai-run-failed:vertex-ai-run-failed-sub,analysis-recommendation-request:analysis-recommendation-request-sub"
        ports:
          - 8681:8681
        options: >-
          --health-cmd "nc -z localhost 8681 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Grant execute permission for gradlew
        working-directory: ./quant-jump-stock-core
        run: chmod +x gradlew

      - name: 📦 Build with Gradle
        working-directory: ./quant-jump-stock-core
        run: ./gradlew build -x test
        env:
          PUBSUB_EMULATOR_HOST: localhost:8681
          PUBSUB_PROJECT_ID: quantiq-local
          GCP_PROJECT_ID: quantiq-local
          GCP_ENABLED: false

      - name: 🧪 Run tests
        working-directory: ./quant-jump-stock-core
        run: ./gradlew test
        env:
          # Database
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: quantiq
          DB_USER: quantiq_user
          DB_PASSWORD: quantiq_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/quantiq
          SPRING_DATASOURCE_USERNAME: quantiq_user
          SPRING_DATASOURCE_PASSWORD: quantiq_password
          # MongoDB
          MONGODB_URI: mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin
          SPRING_DATA_MONGODB_URI: mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin
          # Pub/Sub Emulator
          PUBSUB_EMULATOR_HOST: localhost:8681
          PUBSUB_PROJECT_ID: quantiq-local
          GCP_PROJECT_ID: quantiq-local
          GCP_ENABLED: false
          # Security
          APP_ENCRYPTION_KEY: CHANGE_THIS_TO_32_CHARACTERS_KEY
          # Test keys (not real)
          FRED_API_KEY: test_fred_key_for_ci
          KIS_APP_KEY: test_kis_key
          KIS_APP_SECRET: test_kis_secret

      - name: 📊 Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Kotlin Core Test Results
          path: quant-jump-stock-core/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: 📈 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-test-results
          path: quant-jump-stock-core/build/reports/tests/test/

  # ============================================
  # Python/FastAPI Data Engine 테스트
  # ============================================
  test-python-data-engine:
    name: Test Python Data Engine
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.data-engine == 'true'

    services:
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: quantiq_user
          MONGO_INITDB_ROOT_PASSWORD: quantiq_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Pub/Sub Emulator
      pubsub-emulator:
        image: thekevjames/gcloud-pubsub-emulator:latest
        env:
          PUBSUB_PROJECT1: "quantiq-local,economic-data-update-request:economic-data-update-request-sub,analysis-technical-request:analysis-technical-request-sub,analysis-sentiment-request:analysis-sentiment-request-sub,quantiq-backtest-request:quantiq-backtest-request-sub,vertex-ai-run-request:vertex-ai-run-request-sub,quantiq-economic-data-updated:quantiq-economic-data-updated-sub,quantiq-economic-data-sync-failed:quantiq-economic-data-sync-failed-sub,quantiq-analysis-completed:quantiq-analysis-completed-sub,quantiq-backtest-completed:quantiq-backtest-completed-sub,quantiq-backtest-failed:quantiq-backtest-failed-sub,quantiq-trading-signal-detected:quantiq-trading-signal-detected-sub,analysis-technical-failed:analysis-technical-failed-sub,analysis-sentiment-failed:analysis-sentiment-failed-sub,strategy-execution-completed:strategy-execution-completed-sub,strategy-execution-failed:strategy-execution-failed-sub,vertex-ai-run-submitted:vertex-ai-run-submitted-sub,vertex-ai-run-failed:vertex-ai-run-failed-sub,analysis-recommendation-request:analysis-recommendation-request-sub"
        ports:
          - 8681:8681
        options: >-
          --health-cmd "nc -z localhost 8681 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔧 Install dependencies
        working-directory: ./quant-jump-stock-data-engine
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: ✅ Check Python syntax
        working-directory: ./quant-jump-stock-data-engine
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*")

      - name: 🧪 Run pytest (if exists)
        working-directory: ./quant-jump-stock-data-engine
        if: hashFiles('quant-jump-stock-data-engine/tests/**') != ''
        run: poetry run pytest
        env:
          MONGODB_URI: mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin
          DB_HOST: localhost
          DB_PORT: 5432
          PUBSUB_EMULATOR_HOST: localhost:8681
          PUBSUB_PROJECT_ID: quantiq-local

      - name: 📊 Upload Python test results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('quant-jump-stock-data-engine/tests/**') != ''
        with:
          name: python-test-results
          path: quant-jump-stock-data-engine/.pytest_cache/

  # ============================================
  # 통합 상태 체크
  # ============================================
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [detect-changes, test-kotlin-core, test-python-data-engine]
    if: always()

    steps:
      - name: 📊 Check test results
        run: |
          echo "Core changed: ${{ needs.detect-changes.outputs.core }}"
          echo "Data Engine changed: ${{ needs.detect-changes.outputs.data-engine }}"
          echo "Core test result: ${{ needs.test-kotlin-core.result }}"
          echo "Data Engine test result: ${{ needs.test-python-data-engine.result }}"

      - name: ✅ All tests passed
        if: |
          (needs.detect-changes.outputs.core != 'true' || needs.test-kotlin-core.result == 'success') &&
          (needs.detect-changes.outputs.data-engine != 'true' || needs.test-python-data-engine.result == 'success')
        run: echo "✅ All backend tests passed!"

      - name: ❌ Some tests failed
        if: |
          (needs.detect-changes.outputs.core == 'true' && needs.test-kotlin-core.result != 'success') ||
          (needs.detect-changes.outputs.data-engine == 'true' && needs.test-python-data-engine.result != 'success')
        run: |
          echo "❌ Backend tests failed!"
          echo "Kotlin Core: ${{ needs.test-kotlin-core.result }}"
          echo "Python Data Engine: ${{ needs.test-python-data-engine.result }}"
          exit 1
