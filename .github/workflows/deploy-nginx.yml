name: Deploy Nginx

on:
  push:
    branches: [main]
    paths:
      - 'nginx/**'
      - '.github/workflows/deploy-nginx.yml'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Docker Build & Push ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ env.AR_REPO }}/qjs-nginx:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to VM ────────────────────────────────
      - name: Deploy Nginx to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quant-jump-stock

            # Create docker-compose .env if not exists
            if [ ! -f .env ]; then
              echo "AR_REPO=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker" > .env
            fi

            # Pull & restart Nginx only
            docker compose -f docker-compose.prod.yml pull nginx
            docker compose -f docker-compose.prod.yml up -d --no-deps nginx
            docker image prune -f

            # Health check
            echo "⏳ Waiting for Nginx startup..."
            for i in $(seq 1 10); do
              sleep 2
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                echo "✅ Nginx is healthy!"
                exit 0
              fi
              echo "  ...attempt $i/10"
            done
            echo "❌ Nginx not ready after 20s"
            exit 1
