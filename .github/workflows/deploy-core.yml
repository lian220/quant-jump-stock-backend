name: Deploy Core API

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-core/**'
      - '.github/workflows/deploy-core.yml'
      - '!**.md'
      - '!docs/**'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Java Build ──────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Core JAR
        working-directory: quant-jump-stock-core
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # ── Docker Build & Push ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core
        uses: docker/build-push-action@v5
        with:
          context: ./quant-jump-stock-core
          push: true
          tags: ${{ env.AR_REPO }}/qjs-core:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Sync Config Files to VM ─────────────────────
      - name: Upload config files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: /opt/quant-jump-stock
          overwrite: true

      # ── Deploy to VM ────────────────────────────────
      - name: Deploy Core API to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quant-jump-stock

            # Secret Manager에서 env 파일 3개 다운로드
            gcloud secrets versions access latest --secret=qjs-env-common \
              > ./quant-jump-stock-backend/.env.common
            gcloud secrets versions access latest --secret=qjs-env-db-prod \
              > ./quant-jump-stock-backend/.env.db.prod
            gcloud secrets versions access latest --secret=qjs-env-prod \
              > ./quant-jump-stock-backend/.env.prod

            # docker-compose ${AR_REPO} 치환용 .env
            grep '^AR_REPO=' ./quant-jump-stock-backend/.env.prod > .env

            # Pull & restart Core API
            docker compose -f docker-compose.prod.yml pull core
            docker compose -f docker-compose.prod.yml up -d --no-deps core
            docker image prune -f

            # Nginx reload
            docker compose -f docker-compose.prod.yml up -d --no-deps nginx
            docker exec qjs-nginx nginx -s reload 2>/dev/null || true

            echo "Core API deployed to VM"

      # ── Health Check ────────────────────────────────
      - name: Verify Deployment
        run: |
          echo "Waiting for Core API startup..."
          for i in $(seq 1 12); do
            sleep 10
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -k \
              "https://${{ secrets.GCE_HOST }}/api/v1/auth/oauth2/urls" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Core API is healthy!"
              exit 0
            fi
            echo "  ...attempt $i/12 (HTTP $HTTP_CODE)"
          done
          echo "Core API not ready after 120s"
          exit 1
