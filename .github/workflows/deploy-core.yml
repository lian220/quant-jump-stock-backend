name: Deploy Core API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-core/src/main/**'
      - 'quant-jump-stock-core/build.gradle.kts'
      - 'quant-jump-stock-core/Dockerfile.native'
      - 'quant-jump-stock-core/entrypoint.sh'
      - '.github/workflows/deploy-core.yml'
      - '!**.md'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── GraalVM Native Build ───────────────────────────
      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Configure swap (OOM 방지)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build Native Image
        working-directory: quant-jump-stock-core
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: |
          chmod +x ./gradlew
          ./gradlew clean nativeCompile -x test \
            -Dspring.profiles.active=prod \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -PnativeImageArgs="-J-Xmx12g,-Ob"

      # ── Docker Build & Push ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Core (Native)
        uses: docker/build-push-action@v6
        with:
          context: ./quant-jump-stock-core
          file: ./quant-jump-stock-core/Dockerfile.native
          push: true
          tags: |
            ${{ env.AR_REPO }}/qjs-core:latest
            ${{ env.AR_REPO }}/qjs-core:native-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ──────────────────────────
      - name: Deploy Core API to Cloud Run
        run: |
          gcloud run deploy qjs-core \
            --image ${{ env.AR_REPO }}/qjs-core:native-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 1Gi --cpu 2 \
            --min-instances 0 --max-instances 3 \
            --port 8080 --timeout 600 \
            --cpu-boost \
            --service-account qjs-core-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --update-env-vars "SPRING_PROFILES_ACTIVE=prod,PUBSUB_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},TZ=Asia/Seoul,SERVER_PORT=8080,SWAGGER_ENABLED=false" \
            --set-secrets "/secrets/common/env=qjs-env-common:latest,/secrets/db-prod/env=qjs-env-db-prod:latest,/secrets/prod/env=qjs-env-prod:latest" \
            --startup-probe "httpGet.path=/actuator/health/readiness,httpGet.port=8080,periodSeconds=3,timeoutSeconds=3,failureThreshold=30,initialDelaySeconds=0" \
            --liveness-probe "httpGet.path=/actuator/health/liveness,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3" \
            --labels "commit-sha=${{ github.sha }},managed-by=github-actions"
          # 2026-05-22 사고 후속:
          #   startup-probe → readiness (DB/Mongo 의존성 포함) — 의존성 미충족 시 rollout 차단
          #   liveness 는 그대로 (shallow, JVM 가동 여부만)

      # ── Route Traffic to Latest ─────────────────────────
      # 2026-05-22 사고 후속: 수동 update-traffic (--to-revisions=xxx=100) 으로 traffic 을
      # 특정 revision 에 pin 한 경우, 다음 deploy 는 새 revision 만들지만 traffic 미전환.
      # deploy-data-engine.yml 의 동일 패턴 (--to-latest) 을 Core 에도 적용.
      - name: Route traffic to latest revision
        run: |
          gcloud run services update-traffic qjs-core \
            --to-latest \
            --region ${{ env.REGION }}

      - name: Verify volume/mount consistency (사고 재발 방지)
        run: |
          # 2026-05-22 사고: --set-secrets 가 volumeMounts/volumes mismatch 만든 사례.
          # spec drift 즉시 catch — mismatch 있으면 deploy 실패 처리.
          # 2026-05-22 fix: 이전 jq IN($vols) stream binding 가 single-value 오작동 → false positive.
          #                 array diff (mounts - volumes) 로 정확한 검증.
          MISMATCH=$(gcloud run services describe qjs-core \
            --region ${{ env.REGION }} --format=json \
            | jq -r '([.spec.template.spec.containers[0].volumeMounts[].name] - [.spec.template.spec.volumes[].name]) | join(",")')
          if [ -n "$MISMATCH" ]; then
            echo "❌ volumeMounts 가 존재하지 않는 volume 가리킴: $MISMATCH"
            echo "   --update-secrets 재실행 필요 (또는 GitHub action deploy-cloudrun@v3 마이그레이션)"
            exit 1
          fi
          echo "✅ volumeMounts ↔ volumes 정합성 OK"

      - name: Verify Cloud Run Deployment (readiness — 의존성 포함)
        run: |
          SERVICE_URL=$(gcloud run services describe qjs-core \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run URL: $SERVICE_URL"
          # 2026-05-22 사고 후속: liveness → readiness 폴링 (Mongo/DB 의존성 포함)
          for i in $(seq 1 20); do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              "$SERVICE_URL/actuator/health/readiness" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Core API readiness OK (DB/Mongo 포함)"
              exit 0
            fi
            echo "  ...attempt $i/20 (HTTP $HTTP_CODE)"
          done
          echo "❌ Core API readiness 미통과 (DB/Mongo 의존성 실패 가능성). 100s 후 timeout."
          # 진단 정보 출력
          curl -sf "$SERVICE_URL/actuator/health" 2>&1 | head -20 || true
          exit 1
