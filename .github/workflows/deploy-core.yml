name: Deploy Core API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-core/src/main/**'
      - 'quant-jump-stock-core/build.gradle.kts'
      - 'quant-jump-stock-core/Dockerfile.native'
      - 'quant-jump-stock-core/entrypoint.sh'
      - '.github/workflows/deploy-core.yml'
      - '!**.md'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── GraalVM Native Build ───────────────────────────
      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Configure swap (OOM 방지)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build Native Image
        working-directory: quant-jump-stock-core
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: |
          chmod +x ./gradlew
          ./gradlew clean nativeCompile -x test \
            -Dspring.profiles.active=prod \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -PnativeImageArgs="-J-Xmx12g,-Ob"

      # ── Docker Build & Push ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core (Native)
        uses: docker/build-push-action@v5
        with:
          context: ./quant-jump-stock-core
          file: ./quant-jump-stock-core/Dockerfile.native
          push: true
          tags: |
            ${{ env.AR_REPO }}/qjs-core:latest
            ${{ env.AR_REPO }}/qjs-core:native-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ──────────────────────────
      - name: Deploy Core API to Cloud Run
        run: |
          gcloud run deploy qjs-core \
            --image ${{ env.AR_REPO }}/qjs-core:native-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --no-allow-unauthenticated \
            --memory 1Gi --cpu 2 \
            --min-instances 0 --max-instances 3 \
            --port 8080 --timeout 600 \
            --cpu-boost \
            --service-account qjs-core-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --update-env-vars "SPRING_PROFILES_ACTIVE=prod,PUBSUB_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},TZ=Asia/Seoul,SERVER_PORT=8080" \
            --set-secrets "/secrets/common/env=qjs-env-common:latest,/secrets/db-prod/env=qjs-env-db-prod:latest,/secrets/prod/env=qjs-env-prod:latest" \
            --startup-probe "httpGet.path=/actuator/health/liveness,httpGet.port=8080,periodSeconds=3,timeoutSeconds=3,failureThreshold=30,initialDelaySeconds=0" \
            --liveness-probe "httpGet.path=/actuator/health/liveness,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3" \
            --labels "commit-sha=${{ github.sha }},managed-by=github-actions"

      - name: Verify Cloud Run Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe qjs-core \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run URL: $SERVICE_URL"
          TOKEN=$(gcloud auth print-identity-token)
          for i in $(seq 1 15); do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL/actuator/health/liveness" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Core API Cloud Run is healthy!"
              exit 0
            fi
            echo "  ...attempt $i/15 (HTTP $HTTP_CODE)"
          done
          echo "Core API Cloud Run not ready after 75s"
          exit 1
