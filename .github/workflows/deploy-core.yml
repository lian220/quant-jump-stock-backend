name: Deploy Core API

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-core/src/main/**'
      - 'quant-jump-stock-core/build.gradle.kts'
      - 'quant-jump-stock-core/Dockerfile.native'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - 'deploy/**'
      - '.github/workflows/deploy-core.yml'
      - '!**.md'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── GraalVM Native Build ───────────────────────────
      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Configure swap (OOM 방지)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build Native Image
        working-directory: quant-jump-stock-core
        run: |
          chmod +x ./gradlew
          ./gradlew nativeCompile -x test \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -PnativeImageArgs="-J-Xmx12g,-Ob"

      # ── Docker Build & Push ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core (Native)
        uses: docker/build-push-action@v5
        with:
          context: ./quant-jump-stock-core
          file: ./quant-jump-stock-core/Dockerfile.native
          push: true
          tags: |
            ${{ env.AR_REPO }}/qjs-core:latest
            ${{ env.AR_REPO }}/qjs-core:native-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Sync Config Files to VM (IAP tunnel) ───────────
      - name: Upload config files to VM
        run: |
          tar czf /tmp/deploy-config.tar.gz docker-compose.prod.yml nginx/nginx.conf deploy/deploy.sh
          gcloud compute scp --tunnel-through-iap --zone=${{ env.REGION }}-a --quiet \
            /tmp/deploy-config.tar.gz \
            ${{ secrets.GCE_USERNAME }}@qjs-vm:/tmp/deploy-config.tar.gz \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud compute ssh --tunnel-through-iap --zone=${{ env.REGION }}-a --quiet \
            ${{ secrets.GCE_USERNAME }}@qjs-vm \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="cd /opt/quant-jump-stock && tar xzf /tmp/deploy-config.tar.gz && rm /tmp/deploy-config.tar.gz"

      # ── Deploy to VM (IAP tunnel) ─────────────────────
      - name: Deploy Core API to VM
        run: |
          gcloud compute ssh --tunnel-through-iap --zone=${{ env.REGION }}-a --quiet \
            ${{ secrets.GCE_USERNAME }}@qjs-vm \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="cd /opt/quant-jump-stock && \
              chmod +x ./deploy/deploy.sh && \
              gcloud secrets versions access latest --secret=qjs-env-common > ./quant-jump-stock-backend/.env.common && \
              gcloud secrets versions access latest --secret=qjs-env-db-prod > ./quant-jump-stock-backend/.env.db.prod && \
              gcloud secrets versions access latest --secret=qjs-env-prod > ./quant-jump-stock-backend/.env.prod && \
              grep '^AR_REPO=' ./quant-jump-stock-backend/.env.prod > .env && \
              docker compose -f docker-compose.prod.yml pull core && \
              docker compose -f docker-compose.prod.yml up -d --no-deps core && \
              docker image prune -f && \
              docker compose -f docker-compose.prod.yml up -d --no-deps nginx && \
              docker exec qjs-nginx nginx -s reload 2>/dev/null; \
              echo 'Core API (native) deployed to VM'"

      # ── Health Check ───────────────────────────────────
      - name: Verify Deployment
        run: |
          echo "Waiting for Core API startup (native ~2s)..."
          HEALTH_URL="https://${{ secrets.GCE_HOST }}/api/v1/auth/oauth2/urls"
          for i in $(seq 1 6); do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -k \
              "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Core API is healthy!"
              exit 0
            fi
            echo "  ...attempt $i/6 (HTTP $HTTP_CODE)"
          done
          echo "Core API not ready after 30s"
          exit 1
