name: Deploy Core API

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-core/**'
      - '.github/workflows/deploy-core.yml'
      - '!**.md'
      - '!docs/**'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Java Build ──────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Core JAR
        working-directory: quant-jump-stock-core
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # ── Docker Build & Push ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core
        uses: docker/build-push-action@v5
        with:
          context: ./quant-jump-stock-core
          push: true
          tags: ${{ env.AR_REPO }}/qjs-core:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to VM ────────────────────────────────
      - name: Deploy Core to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quant-jump-stock

            # Pull .env from Secret Manager
            gcloud secrets versions access latest --secret=qjs-env-common \
              > ./quant-jump-stock-backend/.env.common 2>/dev/null
            gcloud secrets versions access latest --secret=qjs-env-prod \
              > ./quant-jump-stock-backend/.env.prod 2>/dev/null

            # Validate secrets were fetched
            if [ ! -s ./quant-jump-stock-backend/.env.common ] || [ ! -s ./quant-jump-stock-backend/.env.prod ]; then
              echo "❌ Failed to fetch secrets from Secret Manager"
              exit 1
            fi

            # Vertex AI credentials
            mkdir -p ./credentials
            gcloud secrets versions access latest --secret=qjs-vertex-ai-key \
              > ./credentials/vertex-ai-key.json 2>/dev/null || echo "⚠️ qjs-vertex-ai-key not found (Vertex AI disabled)"
            if [ -f ./credentials/vertex-ai-key.json ] && [ -s ./credentials/vertex-ai-key.json ]; then
              chmod 600 ./credentials/vertex-ai-key.json
            fi

            # Create docker-compose .env
            : > .env
            grep -v '^\s*#' ./quant-jump-stock-backend/.env.common | grep -v '^\s*$' >> .env
            grep -v '^\s*#' ./quant-jump-stock-backend/.env.prod | grep -v '^\s*$' >> .env
            echo "AR_REPO=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker" >> .env

            # Sync config files from repo (nginx.conf, docker-compose 등)
            git fetch origin main --quiet 2>/dev/null || true
            git checkout origin/main -- docker-compose.prod.yml nginx/ 2>/dev/null || true

            # Pull & restart Core only
            docker compose -f docker-compose.prod.yml pull core
            docker compose -f docker-compose.prod.yml up -d --no-deps core
            docker image prune -f

            # Nginx graceful reload → 새 컨테이너 IP 즉시 반영 (다운타임 없음)
            docker exec qjs-nginx nginx -s reload 2>/dev/null || true

            # Health check (nginx /api/ → core:10010 prefix 유지이므로 실제 API 엔드포인트로 확인)
            echo "⏳ Waiting for Core API startup..."
            for i in $(seq 1 60); do
              sleep 5
              if curl -sf http://localhost/api/v1/auth/oauth2/urls > /dev/null 2>&1; then
                echo "✅ Core API is healthy!"
                exit 0
              fi
              echo "  ...attempt $i/60"
            done
            echo "❌ Core API not ready after 300s"
            exit 1
