name: Deploy ML Package (Vertex AI tar.gz)

# 2026-05-29 사고 후속:
# 2026-05-20 commit 4ad49e8 (predict_optimized.py 의 stock_predictions reader string query fix)
# 가 main 머지됐지만 ML package 가 GCS 에 자동 업로드되지 않아 5/28 까지 8일간 prod 미반영.
# Vertex AI Job 7일 연속 FAILED → 추천 마비.
#
# 본 workflow 는 predict_optimized.py 또는 storage_service 변경 시 자동으로
# /api/v1/ml/upload endpoint 호출 → Cloud Run Data Engine 이 main 코드로 v+1 빌드 + GCS upload.
# 다음 Vertex AI Job 부터 자동 최신 코드 사용 (get_latest_package_uri 가 max version 검색).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-data-engine/src/ml/predict_optimized.py'
      - 'quant-jump-stock-data-engine/src/adapter/output/gcp/storage_service.py'
      - '.github/workflows/deploy-ml-package.yml'

env:
  REGION: asia-northeast3
  SERVICE_NAME: qjs-data-engine

jobs:
  upload-ml-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WIF(keyless) 인증 — OIDC 토큰 발급에 id-token: write 필요
    permissions:
      contents: read
      id-token: write
    # deploy-data-engine.yml 이 먼저 끝나야 main 코드가 Cloud Run 에 반영됨.
    # 같은 push event 의 동시 실행 시 race 방지: deploy-data-engine 의 다음 step 으로 가는 게
    # 이상적이지만, 별 workflow 로 분리해 명확화. Cloud Run rollout 대기 step 으로 safety.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GCP 이관(2026-08): SA JSON 키 → WIF keyless 전환.
      # GCP_WIF_PROVIDER = `terraform output wif_provider` 값 (GitHub Secrets 등록 필요)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: qjs-github-actions@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ── Data Engine 의 main 반영 대기 ─────────────────
      # deploy-data-engine.yml 이 같은 push 로 트리거되는데, 그게 끝나야 새 코드의
      # /api/v1/ml/upload 가 최신 predict_optimized.py 를 빌드. 안전을 위해 commit-sha 일치 확인.
      - name: Wait for Cloud Run to roll out current commit
        run: |
          TARGET_SHA="${{ github.sha }}"
          echo "Waiting for qjs-data-engine to reflect commit ${TARGET_SHA:0:7}..."
          for i in $(seq 1 30); do
            sleep 10
            CURRENT_SHA=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --format='value(metadata.labels.commit-sha)' 2>/dev/null || echo "")
            if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
              echo "✅ Cloud Run revision now serves commit ${TARGET_SHA:0:7}"
              exit 0
            fi
            echo "  ...attempt $i/30 (current=${CURRENT_SHA:0:7})"
          done
          echo "❌ Cloud Run 가 ${TARGET_SHA:0:7} 미반영 — deploy-data-engine.yml 진행 확인 필요"
          exit 1

      # ── Upload v+1 (main 의 predict_optimized.py 로 빌드 + GCS) ─
      - name: Trigger ML package upload
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          # WIF(external_account) 자격증명은 identity token 직접 발급 불가 →
          # SA self-impersonation으로 발급 (SA에 roles/iam.serviceAccountTokenCreator self 바인딩 필요)
          TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="qjs-github-actions@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --audiences="$SERVICE_URL")
          echo "Calling POST $SERVICE_URL/api/v1/ml/upload"
          RESPONSE=$(curl -sS -m 120 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$SERVICE_URL/api/v1/ml/upload")
          echo "Response: $RESPONSE"
          # success: true 확인
          echo "$RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if not d.get('success'):
              print(f'❌ upload failed: {d}', file=sys.stderr)
              sys.exit(1)
          print(f'✅ Uploaded {d.get(\"gcs_uri\")} (v{d.get(\"version\")})')
          "

      # ── 검증: 새 version 이 GCS 에 진짜 올라왔는지 ──────
      - name: Verify GCS package
        run: |
          # latest pointer 확인 (예: predict_optimized-latest.tar.gz)
          # GCP 이관(2026-08): focal-limiter-stock-trading-packages → arboreal 버킷
          BUCKET="stock-trading-packages"
          gsutil ls -l "gs://$BUCKET/ml-packages/predict_optimized-latest.tar.gz" || exit 1
          # 가장 최근 v+1 파일
          gsutil ls -l "gs://$BUCKET/ml-packages/" | tail -3
          echo "✅ ML package GCS 업로드 검증 완료"
