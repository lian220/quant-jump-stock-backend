name: Deploy Secret Version Alert Cloud Function

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-data-engine/cloud_functions/secret_version_alert/**'
      - '.github/workflows/deploy-cf-secret-version-alert.yml'
      - '!**.md'
  workflow_dispatch:

env:
  REGION: asia-northeast3
  FUNCTION_NAME: secret-version-alert
  RUNTIME: python311
  ENTRY_POINT: secret_version_alert
  SOURCE_DIR: ./quant-jump-stock-data-engine/cloud_functions/secret_version_alert

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify imports
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          pip install -q -r requirements.txt
          python -c "from main import secret_version_alert; print('Import OK')"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Cloud Function (gen2 + Eventarc audit log trigger)
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --region=${{ env.REGION }} \
            --runtime=${{ env.RUNTIME }} \
            --source=${{ env.SOURCE_DIR }} \
            --entry-point=${{ env.ENTRY_POINT }} \
            --trigger-event-filters="type=google.cloud.audit.log.v1.written" \
            --trigger-event-filters="serviceName=secretmanager.googleapis.com" \
            --trigger-location=global \
            --memory=256Mi \
            --timeout=60s \
            --min-instances=0 \
            --max-instances=3 \
            --service-account=qjs-data-engine@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets="SECRET_BUNDLE=qjs-env-common:latest"

      - name: Verify Deployment
        run: |
          gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ env.REGION }} \
            --gen2 \
            --format='value(state,serviceConfig.uri,eventTrigger.eventFilters)'
