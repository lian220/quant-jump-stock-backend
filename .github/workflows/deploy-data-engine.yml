name: Deploy Data Engine

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-data-engine/**'
      - '.github/workflows/deploy-data-engine.yml'
      - '!**.md'
      - '!docs/**'
      - '!quant-jump-stock-data-engine/cloud_functions/**'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker
  CLOUD_RUN_SERVICE: qjs-data-engine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Docker Build & Push ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Data Engine
        uses: docker/build-push-action@v6
        with:
          context: ./quant-jump-stock-data-engine
          push: true
          tags: ${{ env.AR_REPO }}/qjs-data-engine:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ────────────────────────
      # 시크릿은 Secret Manager 볼륨 마운트로 주입 (평문 env_vars 제거)
      # 앱이 /secrets/*/env 파일을 .env로 로드 (K_SERVICE 환경변수로 Cloud Run 감지)
      - name: Deploy Data Engine to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.AR_REPO }}/qjs-data-engine:latest
          region: ${{ env.REGION }}
          # 2026-05-15 사고 후속 — Pub/Sub publish background thread CPU starvation 차단
          # --no-cpu-throttling: 인스턴스 살아있는 동안 항상 CPU 할당 (SDK background thread 보장)
          # --min-instances=1: cold start cascade 방지 (cron 발화 시 publish stall 차단)
          # 비용 영향: idle 1 vCPU ≈ $5/월 (수용 가능)
          flags: >-
            --no-allow-unauthenticated
            --memory=1Gi --cpu=1
            --min-instances=1 --max-instances=3
            --port=8080 --timeout=600
            --no-cpu-throttling
            --service-account=qjs-data-engine@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          env_vars: |
            PUBSUB_MODE=push
            VERTEX_AI_ENABLED=true
            GCP_ENABLED=true
          secrets: |
            /secrets/common/env=qjs-env-common:latest
            /secrets/db-prod/env=qjs-env-db-prod:latest
            /secrets/prod/env=qjs-env-prod:latest

      # ── Health Check ───────────────────────────────
      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run URL: $SERVICE_URL"

          TOKEN=$(gcloud auth print-identity-token)

          echo "Waiting for Data Engine startup..."
          for i in $(seq 1 10); do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Data Engine is healthy!"
              exit 0
            fi
            echo "  ...attempt $i/10 (HTTP $HTTP_CODE)"
          done
          echo "❌ Data Engine not ready after 50s"
          exit 1
