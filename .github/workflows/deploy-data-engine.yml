name: Deploy Data Engine

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-data-engine/**'
      - '.github/workflows/deploy-data-engine.yml'
      - '!**.md'
      - '!docs/**'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker
  CLOUD_RUN_SERVICE: qjs-data-engine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Load env from Secret Manager ──────────────
      - name: Load environment variables
        run: |
          gcloud secrets versions access latest --secret=qjs-env-common > /tmp/env-common
          gcloud secrets versions access latest --secret=qjs-env-db-prod > /tmp/env-db-prod
          gcloud secrets versions access latest --secret=qjs-env-prod > /tmp/env-prod

          # 주석/빈줄 제거 후 GITHUB_ENV에 추가
          grep -v '^\s*#' /tmp/env-common | grep -v '^\s*$' >> $GITHUB_ENV
          grep -v '^\s*#' /tmp/env-db-prod | grep -v '^\s*$' >> $GITHUB_ENV
          grep -v '^\s*#' /tmp/env-prod | grep -v '^\s*$' >> $GITHUB_ENV

          rm -f /tmp/env-common /tmp/env-db-prod /tmp/env-prod

      # ── Docker Build & Push ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Data Engine
        uses: docker/build-push-action@v5
        with:
          context: ./quant-jump-stock-data-engine
          push: true
          tags: ${{ env.AR_REPO }}/qjs-data-engine:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ────────────────────────
      - name: Deploy Data Engine to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.AR_REPO }}/qjs-data-engine:latest
          region: ${{ env.REGION }}
          flags: >-
            --no-allow-unauthenticated
            --memory=1Gi --cpu=1
            --min-instances=0 --max-instances=3
            --port=8080 --timeout=300
            --service-account=qjs-data-engine@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          env_vars: |
            PUBSUB_MODE=push
            ENVIRONMENT=prod
            VERTEX_AI_ENABLED=true
            PUBSUB_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            LOG_LEVEL=INFO
            MONGODB_URI=${{ env.MONGODB_URI }}
            MONGODB_DB_NAME=${{ env.MONGODB_DB_NAME }}
            DB_HOST=${{ env.DB_HOST }}
            DB_PORT=${{ env.DB_PORT }}
            DB_NAME=${{ env.DB_NAME }}
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ env.DB_PASSWORD }}
            FRED_API_KEY=${{ env.FRED_API_KEY }}
            ALPHA_VANTAGE_API_KEY=${{ env.ALPHA_VANTAGE_API_KEY }}
            ALPHA_VANTAGE_API_KEY_1=${{ env.ALPHA_VANTAGE_API_KEY_1 }}
            ALPHA_VANTAGE_API_KEY_2=${{ env.ALPHA_VANTAGE_API_KEY_2 }}
            SLACK_ENABLED=${{ env.SLACK_ENABLED }}
            SLACK_WEBHOOK_URL_TRADING=${{ env.SLACK_WEBHOOK_URL_TRADING }}
            SLACK_WEBHOOK_URL_ERROR=${{ env.SLACK_WEBHOOK_URL_ERROR }}

      # ── Health Check ───────────────────────────────
      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run URL: $SERVICE_URL"

          TOKEN=$(gcloud auth print-identity-token)

          echo "Waiting for Data Engine startup..."
          for i in $(seq 1 10); do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Data Engine is healthy!"
              exit 0
            fi
            echo "  ...attempt $i/10 (HTTP $HTTP_CODE)"
          done
          echo "❌ Data Engine not ready after 50s"
          exit 1
