name: Deploy Data Engine

on:
  push:
    branches: [main]
    paths:
      - 'quant-jump-stock-data-engine/**'
      - 'scoring_spec.yaml'
      - '.github/workflows/deploy-data-engine.yml'
      - '!**.md'
      - '!docs/**'
      - '!quant-jump-stock-data-engine/cloud_functions/**'

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker
  CLOUD_RUN_SERVICE: qjs-data-engine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Docker Build & Push ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Data Engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./quant-jump-stock-data-engine/Dockerfile
          push: true
          tags: ${{ env.AR_REPO }}/qjs-data-engine:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ────────────────────────
      # 시크릿은 Secret Manager 볼륨 마운트로 주입 (평문 env_vars 제거)
      # 앱이 /secrets/*/env 파일을 .env로 로드 (K_SERVICE 환경변수로 Cloud Run 감지)
      - name: Deploy Data Engine to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.AR_REPO }}/qjs-data-engine:latest
          region: ${{ env.REGION }}
          # 2026-06-17 — scale-to-zero 복귀 (필요할 때만 기동, idle 비용 0)
          #   * min=1 + --no-cpu-throttling 은 5/15 gRPC SDK background-thread publish stall 우회용이었으나,
          #     5/18 에 publisher 가 동기 REST(publisher.py: session.post + raise_for_status, 백그라운드 스레드 없음)로
          #     재작성되어 보호 대상 자체가 사라짐 → 상시 가동 불필요.
          #   * publish 는 요청 수명 안에서 동기 완료되므로 cpu-throttling 기본값으로도 flush 보장.
          #   * Push 구독이 메시지 도착 시 인스턴스를 깨움(cold start) + timeout=600 + push 재시도로 유실 없음.
          #   * 직전(상시 1 vCPU 상시할당)은 idle ≈ $60~70/월. min=0 전환 시 idle ≈ $0.
          flags: >-
            --no-allow-unauthenticated
            --memory=1Gi --cpu=1
            --min-instances=0 --max-instances=3
            --port=8080 --timeout=600
            --service-account=qjs-data-engine@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          env_vars: |
            PUBSUB_MODE=push
            PUBSUB_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            VERTEX_AI_ENABLED=true
            GCP_ENABLED=true
          secrets: |
            /secrets/common/env=qjs-env-common:latest
            /secrets/db-prod/env=qjs-env-db-prod:latest
            /secrets/prod/env=qjs-env-prod:latest

      # ── Route Traffic to Latest ─────────────────────
      # 2026-05-19 — deploy-cloudrun@v3 이 새 revision 생성 후 traffic 이동 안 함
      # (서비스가 특정 revision 에 pinned 되어 있으면 action 이 traffic 보존).
      # 결과: 5/18 사고 후 00083 retired, 00082 가 100% traffic 유지 — 새 코드 미반영.
      # 해결: 명시적으로 LATEST 로 풀어 다음 deploy 부터 자연 흐름 복구.
      - name: Route traffic to latest revision
        run: |
          gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
            --to-latest \
            --region ${{ env.REGION }}

      # ── Verify volume/mount consistency (2026-05-22 사고 재발 방지) ──
      - name: Verify volume/mount consistency
        run: |
          # qjs-core 사고와 동일 패턴 (--set-secrets stream stale) 가 data-engine 에도 발생 가능.
          # array diff (mounts - volumes) 로 mismatch 즉시 catch.
          MISMATCH=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} --format=json \
            | jq -r '([.spec.template.spec.containers[0].volumeMounts[].name] - [.spec.template.spec.volumes[].name]) | join(",")')
          if [ -n "$MISMATCH" ]; then
            echo "❌ volumeMounts 가 존재하지 않는 volume 가리킴: $MISMATCH"
            echo "   --update-secrets 재실행 필요"
            exit 1
          fi
          echo "✅ volumeMounts ↔ volumes 정합성 OK"

      # ── Health Check ───────────────────────────────
      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Cloud Run URL: $SERVICE_URL"

          TOKEN=$(gcloud auth print-identity-token)

          echo "Waiting for Data Engine startup..."
          for i in $(seq 1 10); do
            sleep 5
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Data Engine is healthy!"
              exit 0
            fi
            echo "  ...attempt $i/10 (HTTP $HTTP_CODE)"
          done
          echo "❌ Data Engine not ready after 50s"
          exit 1
