# Docker 내부 DNS resolver (컨테이너 IP 변경 시 자동 재해석)
# valid=10s: 10초마다 DNS 재질의 → 배포 시 컨테이너 재생성되어도 자동 복구
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;

    # ── CORS (Cloud Run 프론트엔드 → VM API) ────────────
    set $cors_origin $http_origin;

    # ── Core API (/api/) ────────────────────────────────
    # Spring Controller가 /api/v1/... 경로를 사용하므로 전체 경로 유지
    location /api/ {
        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        # 변수 사용 → resolver에 의한 동적 DNS 해석 (upstream 블록은 시작 시 1회만 resolve)
        set $upstream_core http://core:10010;
        proxy_pass $upstream_core;
    }

    # ── Data Engine (/data-api/) ────────────────────────
    # FastAPI는 /data-api/ prefix 없이 라우트 정의 → rewrite로 prefix 제거
    location /data-api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        set $upstream_data http://data-engine:10020;
        rewrite ^/data-api/(.*)$ /$1 break;
        proxy_pass $upstream_data;
    }

    # ── Health Check ────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Default: 404 ────────────────────────────────────
    location / {
        return 404 '{"error": "Not Found. API: /api/, Data: /data-api/"}';
        add_header Content-Type application/json;
    }
}

# ── HTTPS Server (SSL/TLS) ──────────────────────────────────
server {
    listen 443 ssl;
    server_name api.alphafoundry.app;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;

    set $cors_origin $http_origin;

    # ── Core API (/api/) ────────────────────────────────
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        set $upstream_core http://core:10010;
        proxy_pass $upstream_core;
    }

    # ── Data Engine (/data-api/) ────────────────────────
    location /data-api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        set $upstream_data http://data-engine:10020;
        rewrite ^/data-api/(.*)$ /$1 break;
        proxy_pass $upstream_data;
    }

    # ── Health Check ────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Default: 404 ────────────────────────────────────
    location / {
        return 404 '{"error": "Not Found. API: /api/, Data: /data-api/"}';
        add_header Content-Type application/json;
    }
}
