# ============================================================
# Nginx (VM) - Core API Reverse Proxy
# ============================================================
# Core API HTTP/HTTPS 트래픽을 core:10010으로 프록시
# Data Engine은 Cloud Run으로 분리됨 (Core API가 직접 호출)
# SSL: Let's Encrypt (certbot) → /etc/nginx/ssl/

resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP → HTTPS 리다이렉트 ─────────────────────────────
server {
    listen 80;
    server_name api.alphafoundry.app;

    # Let's Encrypt 인증서 갱신용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Health Check (HTTP 유지) ─────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://api.alphafoundry.app$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.alphafoundry.app;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── 봇/스캐너 차단 ─────────────────────────────────
    location ~* /\.(env|git|svn|htaccess|htpasswd|DS_Store) {
        access_log off;
        return 403;
    }
    location ~* /(config|settings|admin|phpMyAdmin|phpmyadmin|wp-admin|wp-login) {
        access_log off;
        return 403;
    }
    location ~* /proc/self/environ {
        access_log off;
        return 403;
    }

    # ── Core API ──────────────────────────────────────────
    location /api/ {
        set $upstream_core http://core:10010;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Swagger UI ────────────────────────────────────────
    location /swagger-ui/ {
        set $upstream_core http://core:10010;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        set $upstream_core http://core:10010;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Actuator Health Check ─────────────────────────────
    location /actuator/health {
        set $upstream_core http://core:10010;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── VM Health Check ────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Default ────────────────────────────────────────────
    location / {
        return 404 '{"error":"Not Found"}';
        add_header Content-Type application/json;
    }
}
