# ============================================================
# Nginx (VM) - Scheduler Health Check + 레거시 호환
# ============================================================
# Core API HTTP 트래픽은 Cloud Run (api.alphafoundry.app)으로 이동
# VM Nginx는 모니터링/health check 용도로만 유지

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # ── 봇/스캐너 차단 ─────────────────────────────────
    location ~* /\.(env|git|svn|htaccess|htpasswd|DS_Store) {
        access_log off;
        return 403;
    }
    location ~* /(config|settings|admin|phpMyAdmin|phpmyadmin|wp-admin|wp-login) {
        access_log off;
        return 403;
    }
    location ~* /proc/self/environ {
        access_log off;
        return 403;
    }

    # ── Scheduler Health Check (내부 모니터링) ──────────
    location /scheduler/health {
        set $upstream_scheduler http://scheduler:10010;
        proxy_pass $upstream_scheduler/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── VM Health Check ────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Default: 안내 ──────────────────────────────────
    location / {
        return 200 '{"status":"ok","message":"Core API moved to Cloud Run. Use api.alphafoundry.app"}';
        add_header Content-Type application/json;
    }
}
