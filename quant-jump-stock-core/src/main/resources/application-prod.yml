# ============================================
# Production Profile
# ============================================
# GCE VM 및 Cloud Run 프로덕션 환경 공통 적용
# 부팅 최적화: lazy-init, Hibernate validate 제거, Swagger 비활성화
#
# SECURITY: 이 파일은 Git에 커밋됩니다.
# 비밀번호, API 키, 토큰 등 민감 정보를 절대 추가하지 마세요.
# 시크릿은 GCP Secret Manager (/secrets/*/env) 에서 환경변수로 주입됩니다.

server:
  port: ${PORT:8080}

spring:
  main:
    lazy-initialization: true  # cold start 최적화 (Cloud Run scale-to-zero)

  jpa:
    hibernate:
      ddl-auto: none  # Flyway가 스키마 관리 (35개 Entity 검증 제거)

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    mongodb:
      repositories:
        bootstrap-mode: deferred

  flyway:
    validate-on-migrate: true

# ============================================
# Pub/Sub Pull 구독 비활성화 (Push 사용)
# ============================================
pubsub:
  pull:
    enabled: false

# ============================================
# Swagger 비활성화
# ============================================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ============================================
# 로깅 최적화
# ============================================
logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.data.mongodb: WARN
    com.quantiq: INFO
