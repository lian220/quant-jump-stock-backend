# ============================================
# Local Development Profile
# ============================================
# bootRun, 네이티브 바이너리 직접 실행 시 적용
# Docker 환경에서는 환경변수가 이 값을 오버라이드

spring:
  data:
    mongodb:
      auto-index-creation: true
  cloud:
    gcp:
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8681}

# ============================================
# Vertex AI 설정 (로컬 개발 환경)
# ============================================
# VERTEX_AI_ENABLED=true 환경변수로 로컬에서도 활성화 가능
# Pub/Sub은 위 에뮬레이터 설정으로 별도 관리

# ============================================
# Slack 비활성화 (로컬 개발 환경)
# ============================================
slack:
  enabled: false
  webhook-url: ""
  webhook-url-error: ""
  webhook-url-news: ""
  bot-token: ""
  channel: ""
