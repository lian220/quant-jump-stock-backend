# ============================================
# Server Configuration
# ============================================
server:
  port: ${SERVER_PORT:10010}
  forward-headers-strategy: native

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: quantiq-core
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: true
  jmx:
    enabled: false
  # ============================================
  # PostgreSQL (RDB) Configuration
  # ============================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quantiq}?prepareThreshold=0
    username: ${DB_USER:quantiq_user}
    password: ${DB_PASSWORD:quantiq_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:7}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1

  # ============================================
  # JPA/Hibernate Configuration
  # ============================================
  jpa:
    hibernate:
      ddl-auto: none  # Flyway가 스키마 관리
    generate-ddl: false
    open-in-view: false  # N+1 문제 방지
    defer-datasource-initialization: false
    properties:
      hibernate:
        # dialect 자동 감지 (PostgreSQL 17 — 명시하면 불필요 WARN + 추가 조회)
        jdbc:
          batch_size: 20
          fetch_size: 100
          use_get_generated_keys: true
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false

  # ============================================
  # Flyway Configuration
  # ============================================
  flyway:
    # base default true — dev 에서 main pull 후 신규 마이그레이션 자동 적용 (개발자 편의).
    # prod 는 application-prod.yml 에서 명시적으로 ${FLYWAY_ENABLED:false} override
    # (수동 SQL Editor 적용 후 history 등록 정책 — 운영 안전 우선).
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true  # 기존 DB에 Flyway 적용 시 필요
    baseline-version: 0
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}  # 개발: false, 프로덕션: true
    out-of-order: true  # migration 순서 유연하게 허용
    clean-disabled: true  # 프로덕션 안전장치
    ignore-missing-migrations: true  # 누락된 migration 무시
    ignore-ignored-migrations: true  # 무시된 migration 허용
    ignore-future-migrations: true  # 미래 버전 migration 허용

  # ============================================
  # MongoDB Configuration (분석 데이터)
  # ============================================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://quantiq_user:quantiq_password@localhost:27017/stock_trading?authSource=admin}
      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:false}
    jpa:
      repositories:
        bootstrap-mode: lazy

# ============================================
# Actuator Configuration
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    mongo:
      enabled: true

logging:
  level:
    root: INFO
    com.quantiq: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.data.mongodb: ${LOG_LEVEL_MONGO:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:INFO}
    org.flywaydb: WARN

# ============================================
# SpringDoc OpenAPI (Swagger) Configuration
# ============================================
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  show-actuator: false
  # 올바른 서버 URL 설정 (포트 10010)
  servers:
    - url: http://localhost:10010
      description: Local Development Server

# ============================================
# Slack Configuration
# ============================================
slack:
  enabled: ${SLACK_ENABLED:false}
  webhook-url: ${SLACK_WEBHOOK_URL:}
  webhook-url-error: ${SLACK_WEBHOOK_URL_ERROR:}
  webhook-url-news: ${SLACK_WEBHOOK_URL_NEWS:}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel: ${SLACK_CHANNEL:#trading-alerts}
  channel-scheduler: ${SLACK_CHANNEL_SCHEDULER:}
  channel-analysis: ${SLACK_CHANNEL_ANALYSIS:}

# ============================================
# KIS Configuration (Korean Investment & Securities)
# ============================================
# ⚠️ KIS 계정 정보는 user_kis_accounts 테이블에서 사용자별로 관리됩니다
# kis:
#   (설정 불필요 - DB에서 조회)

# ============================================
# Messaging Configuration
# ============================================
messaging:
  provider: ${MESSAGING_PROVIDER:pubsub}  # pubsub (기본값)

# Pub/Sub: Push 방식 사용 (PubSubPushController)

# ============================================
# Vertex AI Configuration
# ============================================
gcp:
  project-id: ${PUBSUB_PROJECT_ID:quantiq-local}
  vertex-ai:
    enabled: ${VERTEX_AI_ENABLED:false}
    job-name: ${VERTEX_AI_JOB_NAME:quantiq-stock-prediction-job}


# ============================================
# Data Engine Configuration
# ============================================
data-engine:
  base-url: ${DATA_ENGINE_BASE_URL:http://localhost:10020}

# ============================================
# Custom Properties
# ============================================
db:
  rdb:
    enabled: true
  dual-write: ${DB_DUAL_WRITE:true}       # 마이그레이션 기간 MongoDB도 업데이트
  read-source: ${DB_READ_SOURCE:rdb}      # rdb, mongo, both
  migration:
    enabled: ${RUN_MIGRATION:false}

# ============================================
# Application Security Configuration
# ============================================
app:
  security:
    encryption-key: ${APP_ENCRYPTION_KEY:CHANGE_THIS_TO_32_CHARACTERS_KEY}
    # encryption-key-v2: AES-256/GCM 마스터 키 (Base64 32바이트). 운영은 GCP Secret Manager로 주입.
    # default 는 32 zero bytes 의 Base64 — local/test 부팅 편의용. EncryptionServiceGcm 가
    # zero-key 감지 시 prod 프로파일에서는 부팅 실패, 그 외에는 warn 로그를 남긴다.
    encryption-key-v2: ${APP_ENCRYPTION_KEY_V2:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000}

# ============================================
# Spring Security OAuth2 Client Configuration
# ============================================
spring.security.oauth2.client:
  registration:
    naver:
      client-id: ${NAVER_CLIENT_ID:not-configured}
      client-secret: ${NAVER_CLIENT_SECRET:not-configured}
      redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
      authorization-grant-type: authorization_code
      client-authentication-method: client_secret_post
      client-name: Naver
      scope: name,email,profile_image,mobile
  provider:
    naver:
      authorization-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
      user-name-attribute: response

# ============================================
# JWT Configuration
# ============================================
jwt:
  secret: ${JWT_SECRET:quant-jump-stock-dev-secret-minimum-32-characters}
  # Phase 1A 보안 PRE Task 12-B4: access 15분 (RFC 9700 권고). refresh 14일로 무중단 갱신.
  # 운영에서는 JWT_ACCESS_EXPIRATION_MINUTES 환경변수로 override.
  access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  issuer: ${JWT_ISSUER:quant-jump-stock}
  cookie:
    # 운영 분기: application-prod.yml 에서 override (secure=true, sameSite=Lax, domain=.alphafoundry.app)
    name: ${JWT_REFRESH_COOKIE_NAME:refresh_token}
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    domain: ${JWT_COOKIE_DOMAIN:}
    path: ${JWT_COOKIE_PATH:/}
    max-age-days: ${JWT_COOKIE_MAX_AGE_DAYS:14}

# ============================================
# OAuth2 Frontend Configuration
# ============================================
oauth2:
  frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}

# ============================================
# Cloudflare Gateway Configuration
# ============================================
cloudflare:
  gateway-secret: ${CLOUDFLARE_GATEWAY_SECRET:}
