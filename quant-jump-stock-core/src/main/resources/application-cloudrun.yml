# ============================================
# Cloud Run Profile
# ============================================
# Cloud Run 환경 전용 설정
# 활성화: SPRING_PROFILES_ACTIVE=prod,cloudrun
# prod 프로파일과 함께 사용 (ddl-auto: none, Swagger 비활성화 등)

server:
  port: ${PORT:8080}

# ============================================
# Lazy 초기화 (cold start 최적화)
# ============================================
# MongoDB, JPA Repository 등 무거운 빈을 첫 요청 시점까지 지연
# Cloud Run min-instances=0 (scale-to-zero) 최적화
spring:
  main:
    lazy-initialization: true
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    mongodb:
      repositories:
        bootstrap-mode: deferred

# ============================================
# Pub/Sub Pull 구독 비활성화 (Push 사용)
# ============================================
pubsub:
  pull:
    enabled: false
